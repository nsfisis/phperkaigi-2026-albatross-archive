events {
  worker_connections 1024;
}

http {
  include mime.types;

  server {
    listen 80;

    root /var/www;

    location /phperkaigi/2026/code-battle-archive/files/ {
      alias /var/www/archives/files/;
    }

    location /phperkaigi/2026/code-battle-archive/api/ {
      alias /var/www/archives/api/;
    }

    location /phperkaigi/2026/code-battle-archive/ {
      try_files $uri $uri/ /phperkaigi/2026/code-battle-archive/index.html;
    }
  }
}
